<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zenborg · blocked</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="block">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
          <path d="M20 5.5 C 13.5 8, 13.5 13, 16.2 16 C 18.9 19, 18.9 24, 12 26.5" />
        </svg>
      </span>
      <p class="host" id="host"></p>
      <h1 class="title">Blocked</h1>
      <p class="note" id="note"></p>

      <form class="pass" id="pass" hidden>
        <label class="why-label" id="why-label" for="why">What value will I gain by going there?</label>
        <input class="why" id="why" type="text" maxlength="200" autocomplete="off" required />
        <button class="use" id="use" type="submit" disabled></button>
      </form>
      <p class="none" id="none" hidden>No passes left this month. A planned opening can be set through Claude.</p>

      <button id="back" class="back" type="button">go back</button>
      <p class="foot" id="foot"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
