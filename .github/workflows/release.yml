name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# Two quick merges queue instead of racing on the version bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Push to main -> minor bump, commit, tag, push. Tags pushed with
  # GITHUB_TOKEN don't trigger workflows, so the release jobs below run
  # in this same workflow via `needs:`. Skipped for tag pushes and
  # workflow_dispatch (manual releases of the current version).
  bump:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'release:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump, tag, push
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/bump-version.sh minor
          tag="v$(node -p "require('./package.json').version")"
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    needs: bump
    # Run after a successful bump, or on tag push / workflow_dispatch
    # (bump skipped). A skipped bump on a main push means "nothing to release".
    if: >-
      !cancelled() && (needs.bump.result == 'success' ||
      (needs.bump.result == 'skipped' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Zenborg v${process.env.PACKAGE_VERSION}`,
              body: 'See CHANGELOG.md for details.',
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: [bump, create-release]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun (build-time only - compiles the MCP sidecar)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          #
          # NOTARIZATION TEMPORARILY DISABLED (2026-08-21).
          #
          # Apple returns 403 "A required agreement is missing or has expired"
          # until the Developer Program License Agreement is re-accepted by the
          # Account Holder at developer.apple.com/account.
          # That needs an SMS 2FA code unavailable while travelling.
          #
          # Tauri only notarizes when APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID
          # are all present, so commenting them out keeps Developer ID signing
          # (cert valid to 2027-02-01) and skips the notary call entirely.
          #
          # RESTORE AFTER 2026-09-08: accept the agreement, uncomment the three
          # lines below, re-tag. Unnotarized builds are fine on our own machines
          # (the updater replaces the bundle in place and never sets
          # com.apple.quarantine), but a fresh download on someone else's Mac
          # hits the Gatekeeper wall until this is back on.
          #
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target aarch64-apple-darwin'

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: ${{ !cancelled() && needs.build-tauri.result == 'success' }}

    steps:
      - name: Publish release
        id: publish-release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
